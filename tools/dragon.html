<!doctype html>
<meta charset="utf-8">
<title>Ender dragon render</title>
<style>html, body { margin: 0; background: transparent; }</style>
<canvas id="c"></canvas>
<script type="module">
// Builds an ender dragon out of textured boxes and renders it to a transparent PNG. Run by render-dragon.mjs.
// The texture is Pixel Perfection's dragon.png, unchanged. The boxes and their texture offsets follow the layout
// that texture is drawn for; all coordinates are in the game's model space (y points down, the head faces -z).
import * as THREE from './three.module.js';

const TEX = 256;
const INSET = 0.02;
const texture = await new THREE.TextureLoader().loadAsync('./dragon.png');
texture.magFilter = THREE.NearestFilter;
texture.minFilter = THREE.NearestFilter;
texture.generateMipmaps = false;
texture.colorSpace = THREE.SRGBColorSpace;
const material = new THREE.MeshLambertMaterial({ map: texture, alphaTest: 0.5 });

// One box: corner (x, y, z), size (w, h, d), texture offset (u, v). The six faces sit in the texture as
// a strip: [side][front][side][back] with the top and bottom above the front.
function box(x, y, z, w, h, d, u, v, mirror = false) {
  const geometry = new THREE.BoxGeometry(w, h, d);
  geometry.translate(x + w / 2, y + h / 2, z + d / 2);
  const rects = {
    px: [u + d + w, v + d, d, h], nx: [u, v + d, d, h],
    py: [u + d + w, v, w, d], ny: [u + d, v, w, d],
    pz: [u + d + w + d, v + d, w, h], nz: [u + d, v + d, w, h],
  };
  if (mirror) [rects.px, rects.nx] = [rects.nx, rects.px];
  // A flat sheet (the wing skin) keeps only its top and bottom faces; its zero-height sides would draw as hairlines.
  if (h === 0) geometry.setIndex([...geometry.index.array].slice(12, 24));
  const uv = geometry.attributes.uv;
  ['px', 'nx', 'py', 'ny', 'pz', 'nz'].forEach((face, f) => {
    const [ru, rv, rw, rh] = rects[face];
    for (let i = 0; i < 4; i++) {
      let a = uv.getX(f * 4 + i);
      let b = uv.getY(f * 4 + i);
      // The whole model is turned upside down at the end (y down to y up), which spins each side face half a turn.
      if (face[1] !== 'y') { a = 1 - a; b = 1 - b; }
      if (mirror) a = 1 - a;
      // Pull each corner a hair inside its rectangle so an edge never samples the neighbouring texel.
      a = a ? 1 - INSET / rw : INSET / rw;
      b = b ? 1 - INSET / rh : INSET / rh;
      uv.setXY(f * 4 + i, (ru + a * rw) / TEX, 1 - (rv + (1 - b) * rh) / TEX);
    }
  });
  return geometry;
}

function part(parent, position, boxes, rotation = [0, 0, 0]) {
  const group = new THREE.Group();
  group.position.set(...position);
  group.rotation.order = 'ZYX';
  group.rotation.set(...rotation);
  for (const b of boxes) group.add(new THREE.Mesh(box(...b), material));
  parent.add(group);
  return group;
}

const SEGMENT = [[-5, -5, -5, 10, 10, 10, 192, 104], [-1, -9, -3, 2, 4, 6, 48, 0]];

function buildHead(parent, position, rotation, jaw = 0.25) {
  const head = part(parent, position, [
    [-6, -1, -24, 12, 5, 16, 176, 44],
    [-8, -8, -10, 16, 16, 16, 112, 30],
    [-5, -12, -4, 2, 4, 6, 0, 0, true],
    [-5, -3, -22, 2, 2, 4, 112, 0, true],
    [3, -12, -4, 2, 4, 6, 0, 0],
    [3, -3, -22, 2, 2, 4, 112, 0],
  ], rotation);
  part(head, [0, 4, -8], [[-6, 0, -16, 12, 4, 16, 176, 65]], [jaw, 0, 0]);
  return head;
}

function buildDragon() {
  const dragon = new THREE.Group();
  part(dragon, [0, 4, 8], [
    [-12, 0, -16, 24, 24, 64, 0, 0],
    [-1, -6, -10, 2, 6, 12, 220, 53], [-1, -6, 10, 2, 6, 12, 220, 53], [-1, -6, 30, 2, 6, 12, 220, 53],
  ]);

  // Neck: five segments curving up and forward from the chest, then the head.
  let y = 20, z = -12;
  for (const pitch of [-0.62, -0.5, -0.32, -0.1, 0.12]) {
    part(dragon, [0, y, z], SEGMENT, [pitch, 0, 0]);
    y += Math.sin(pitch) * 10;
    z -= Math.cos(pitch) * 10;
  }
  buildHead(dragon, [0, y, z], [0.22, 0, 0]);

  // Tail: twelve segments trailing back with a slow wave.
  y = 10; z = 60;
  for (let i = 0; i < 12; i++) {
    const droop = 0.1 + Math.sin(i * 0.55) * 0.16;
    part(dragon, [0, y, z], SEGMENT, [-droop, 0, 0]);
    y += Math.sin(droop) * 10;
    z += Math.cos(droop) * 10;
  }

  // Wings, mid-beat: raised from the shoulder, the outer half folding back down.
  const left = part(dragon, [12, 5, 2], [[0, -4, -4, 56, 8, 8, 112, 88, true], [0, 0, 2, 56, 0, 56, -56, 88, true]], [-0.03, -0.25, -0.58]);
  part(left, [56, 0, 0], [[0, -2, -2, 56, 4, 4, 112, 136, true], [0, 0, 2, 56, 0, 56, -56, 144, true]], [0, 0, 0.74]);
  const right = part(dragon, [-12, 5, 2], [[-56, -4, -4, 56, 8, 8, 112, 88], [-56, 0, 2, 56, 0, 56, -56, 88]], [-0.03, 0.25, 0.58]);
  part(right, [-56, 0, 0], [[-56, -2, -2, 56, 4, 4, 112, 136], [-56, 0, 2, 56, 0, 56, -56, 144]], [0, 0, -0.74]);

  // Legs, tucked back the way they are in flight.
  for (const side of [-1, 1]) {
    const front = part(dragon, [side * 12, 20, 2], [[-4, -4, -4, 8, 24, 8, 112, 104]], [1.3, 0, 0]);
    const frontTip = part(front, [0, 20, -1], [[-3, -1, -3, 6, 24, 6, 226, 138]], [-0.5, 0, 0]);
    part(frontTip, [0, 23, 0], [[-4, 0, -12, 8, 4, 16, 144, 104]], [0.75, 0, 0]);
    const rear = part(dragon, [side * 16, 16, 42], [[-8, -4, -8, 16, 32, 16, 0, 0]], [1.0, 0, 0]);
    const rearTip = part(rear, [0, 32, -4], [[-6, -2, 0, 12, 32, 12, 196, 0]], [0.5, 0, 0]);
    part(rearTip, [0, 31, 4], [[-9, 0, -20, 18, 6, 24, 112, 0]], [0.75, 0, 0]);
  }
  return dragon;
}

// Renders `subject` from `eye` looking at `target`, trims the empty margin and returns a PNG data URL.
function render(subject, { eye, target, width, height, fov = 28, pad = 8 }) {
  const scene = new THREE.Scene();
  const upright = new THREE.Group();
  upright.rotation.x = Math.PI; // model space has y pointing down
  upright.add(subject);
  scene.add(upright);
  scene.add(new THREE.AmbientLight(0xffffff, 2.5));
  const sun = new THREE.DirectionalLight(0xffffff, 2.4);
  sun.position.set(-0.4, 1, 0.9);
  scene.add(sun);

  const canvas = document.getElementById('c');
  // Drawn at twice the size and scaled down for smooth edges. The browser's own antialiasing is off because it
  // samples the texture just outside a cut-out sheet's edge and leaves hairlines there.
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width * 2, height * 2, false);
  renderer.setClearColor(0x000000, 0);
  const camera = new THREE.PerspectiveCamera(fov, width / height, 1, 4000);
  camera.position.set(...eye);
  camera.lookAt(...target);
  renderer.render(scene, camera);

  const copy = document.createElement('canvas');
  copy.width = width; copy.height = height;
  const ctx = copy.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, 0, 0, width, height);
  const { data } = ctx.getImageData(0, 0, width, height);
  let x0 = width, y0 = height, x1 = -1, y1 = -1;
  for (let py = 0; py < height; py++) for (let px = 0; px < width; px++) {
    if (data[(py * width + px) * 4 + 3] > 8) { x0 = Math.min(x0, px); x1 = Math.max(x1, px); y0 = Math.min(y0, py); y1 = Math.max(y1, py); }
  }
  if (x1 < 0) throw new Error('Nothing was drawn');
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(width - 1, x1 + pad); y1 = Math.min(height - 1, y1 + pad);
  const out = document.createElement('canvas');
  out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
  out.getContext('2d').drawImage(copy, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  renderer.dispose();
  return { url: out.toDataURL('image/png'), width: out.width, height: out.height };
}

const params = new URLSearchParams(location.search);
const num = (name, fallback) => (params.has(name) ? params.get(name).split(',').map(Number) : fallback);
window.__renders = {
  'ender-dragon': render(buildDragon(), { eye: num('eye', [250, 105, 290]), target: num('target', [0, 2, -42]), width: 2400, height: 1600 }),
  'dragon-head': render(buildHead(new THREE.Group(), [0, 0, 0], [0, 0, 0], 0.3).parent, { eye: num('heye', [58, 38, 66]), target: num('htarget', [0, 1, 6]), width: 900, height: 900 }),
};
</script>
